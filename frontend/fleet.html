{% extends 'base.html' %}

{% block title %}DriveLuxe | Fleet{% endblock %}

{% block content %}
<!-- Dedicated Search Banner -->
<section class="fleet-search-banner"
    style="padding: 75px 0 0; background: linear-gradient(180deg, #edf2f7 0%, #f7f9fa 100%); border-bottom: 1px solid var(--border-color);">
</section>
<!-- Main Catalog & Filter Area -->
<main class="catalog-section" style="padding-top: 25px;">
    <div class="container">
        <!-- Category Chips Tabs -->
        <div class="category-tabs-container" id="category-tabs-container"></div>

        <div class="catalog-layout">
            <!-- Sidebar Filters -->
            <aside class="filter-card">
                <div class="filter-header">
                    <h3 class="filter-title"><i class="fa-solid fa-sliders"></i> Filter Fleet</h3>
                    <button class="btn btn-sm btn-outline" style="padding:4px 10px; font-size:0.75rem;"
                        onclick="Customer.resetFilters()">Reset All</button>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Search Model or Brand</label>
                    <input type="text" id="fleet-search-input" class="form-control"
                        placeholder="e.g. Audi, BMW, Porsche..." />
                    <!-- Dynamic Trending Searches from SearchLog -->
                    <div style="margin-top:8px;">
                        <span style="font-size:0.72rem; color:var(--text-muted); display:flex; align-items:center; gap:4px; margin-bottom:5px;">
                            <i class="fa-solid fa-fire" style="color:#ef4444;"></i> Popular Searches:
                        </span>
                        <div id="fleet-trending-searches" style="display:flex; flex-wrap:wrap; gap:4px;">
                            <!-- Rendered dynamically from API -->
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Vehicle Status & Availability</label>
                    <select id="fleet-status-select" class="form-control" style="cursor:pointer; font-size:0.85rem; padding:8px 12px;">
                        <option value="">All Statuses (Full Fleet)</option>
                        <option value="AVAILABLE">Available for Dates</option>
                        <option value="RESERVED_FOR_DATES">Reserved for Dates</option>
                        <option value="RENTED">Currently Rented</option>
                        <option value="MAINTENANCE">In Service / Maintenance</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Max Daily Rate (₹)</label>
                    <input type="range" id="price-range-slider" min="1000" max="10000" step="100" value="10000"
                        style="width:100%; accent-color:var(--primary);" />
                    <div class="price-slider-values">
                        <span>₹1000</span>
                        <strong id="price-max-display" style="color:var(--primary);">₹10000</strong>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Transmission</label>
                    <div class="filter-chips">
                        <div class="filter-chip" data-group="transmission" data-value="AUTOMATIC">Automatic</div>
                        <div class="filter-chip" data-group="transmission" data-value="MANUAL">Manual</div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Powertrain / Fuel</label>
                    <div class="filter-chips">
                        <div class="filter-chip" data-group="fuel_type" data-value="ELECTRIC">Electric</div>
                        <div class="filter-chip" data-group="fuel_type" data-value="HYBRID">Hybrid</div>
                        <div class="filter-chip" data-group="fuel_type" data-value="PETROL">Petrol</div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-group-title">Passenger Capacity</label>
                    <div class="filter-chips">
                        <div class="filter-chip" data-group="seats" data-value="2">2+</div>
                        <div class="filter-chip" data-group="seats" data-value="4">4+</div>
                        <div class="filter-chip" data-group="seats" data-value="5">5+</div>
                        <div class="filter-chip" data-group="seats" data-value="7">7+</div>
                    </div>
                </div>
            </aside>

            <!-- Results & Car Cards Grid -->
            <div>
                <div class="catalog-toolbar">
                    <div class="results-count" id="results-count-display">Loading fleet...</div>
                    <div class="toolbar-actions">
                        <label style="font-size:0.85rem; color:var(--text-secondary);">Sort By:</label>
                        <select id="fleet-sort-select" class="form-control"
                            style="width:auto; padding:6px 12px; font-size:0.85rem;">
                            <option value="">Recommended</option>
                            <option value="price_per_day">Price: Low to High</option>
                            <option value="-price_per_day">Price: High to Low</option>
                            <option value="-year">Newest Model Year</option>
                        </select>
                    </div>
                </div>

                <div class="cars-grid" id="cars-grid-container"></div>

                <!-- Fleet Pagination & Load More Controller -->
                <div id="fleet-pagination-container" class="fleet-pagination-wrapper hidden">
                    <!-- Load More Button Box -->
                    <div id="fleet-load-more-box" class="fleet-load-more-box">
                        <button id="fleet-load-more-btn" class="btn-load-more" onclick="Customer.loadMoreCars()">
                            <i class="fa-solid fa-arrows-rotate"></i>
                            <span>Load More Vehicles</span>
                        </button>
                        <div id="fleet-load-more-progress" style="font-size: 0.82rem; color: var(--text-secondary); font-weight: 600;">
                            <!-- e.g. Showing 9 of 24 vehicles -->
                        </div>
                    </div>

                    <!-- Numbered Page Navigation Bar -->
                    <div id="fleet-pagination-bar" class="fleet-pagination-bar">
                        <div class="page-size-selector">
                            <label for="fleet-page-size-select"><i class="fa-solid fa-list-ol"></i> Per page:</label>
                            <select id="fleet-page-size-select" onchange="Customer.changePageSize(this.value)">
                                <option value="9">9 cars</option>
                                <option value="18">18 cars</option>
                                <option value="27">27 cars</option>
                            </select>
                        </div>

                        <nav class="pagination-pages-list" id="fleet-pages-list" aria-label="Fleet pagination">
                            <!-- Dynamically generated numbered page buttons -->
                        </nav>

                        <div id="fleet-page-summary" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">
                            <!-- Page 1 of 3 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
