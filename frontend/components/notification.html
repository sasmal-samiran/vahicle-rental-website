<div class="modal-backdrop" id="notification-modal">
	<div class="modal-card" style="max-width:520px;">
		<div class="modal-header">
			<h3 class="modal-title"><i class="fa-regular fa-bell"></i> Notifications</h3>
			<button type="button" class="modal-close" data-close-modal="notification-modal"
				aria-label="Close notifications">&times;</button>
		</div>
		<div class="modal-body">
			<div class="notif-header">
				<strong style="font-size:0.9rem;">Recent activity</strong>
				<button class="btn btn-sm btn-outline" style="padding:2px 8px; font-size:0.75rem;"
					onclick="Notifications.markAllRead()">Mark all read</button>
			</div>
			<div class="notif-list" id="notif-list-container"></div>
		</div>
	</div>
</div>
