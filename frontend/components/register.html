<!-- 1. Authentication Modal -->
<div class="modal-backdrop" id="auth-modal">
    <div class="modal-card" style="max-width:440px;">
        <div class="modal-header">
            <h3 class="modal-title">Sign In</h3>
            <button class="modal-close" onclick="Auth.closeAuthModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div
                style="display:flex; background:var(--bg-input); border-radius:var(--radius-md); padding:4px; margin-bottom:20px;">
                <button class="btn btn-sm auth-tab-btn active" data-tab="otp" style="flex:1;"
                    onclick="Auth.switchTab('otp')">
                    <i class="fa-solid fa-mobile-screen"></i> Instant OTP
                </button>
                <button class="btn btn-sm auth-tab-btn" data-tab="password" style="flex:1;"
                    onclick="Auth.switchTab('password')">
                    <i class="fa-solid fa-key"></i> Password
                </button>
            </div>

            <div id="otp-login-form">
                <div id="otp-step-1">
                    <div class="form-group">
                        <label class="form-label">Phone Number or Email</label>
                        <input type="text" id="otp-identifier" class="form-control" placeholder="Enter here"/>
                    </div>
                    <button type="button" class="btn btn-primary" id="send-otp-btn" style="width:100%; margin-top:10px;"
                        onclick="Auth.handleRequestOTP()">
                        Send Verification Code
                    </button>
                </div>

                <div id="otp-step-2" class="hidden">
                    <p style="font-size:0.85rem; color:var(--text-secondary); text-align:center;">
                        Enter the 6-digit code sent to <strong id="otp-display-identifier" style="color:var(--text-primary);"></strong>
                    </p>
                    <div id="dev-otp-preview" class="hidden"
                        style="background:var(--primary-light); border:1px dashed var(--border-highlight); padding:8px 12px; border-radius:var(--radius-sm); text-align:center; font-size:0.85rem; margin:12px 0; color:var(--primary);">
                    </div>
                    <div class="otp-input-container">
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                        <input type="text" class="otp-box" maxlength="1" />
                    </div>
                    <div
                        style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; margin-bottom:16px;">
                        <span id="otp-timer" style="color:var(--text-muted);"></span>
                        <button id="resend-otp-btn" class="btn btn-outline btn-sm" style="padding:2px 8px;"
                            onclick="Auth.handleRequestOTP()" disabled>Resend Code</button>
                    </div>
                    <button type="button" class="btn btn-primary" id="verify-otp-btn" style="width:100%;"
                        onclick="Auth.handleVerifyOTP()">
                        Verify & Continue
                    </button>
                </div>
            </div>

            <div id="password-login-form" class="hidden">
                <div class="form-group">
                    <label class="form-label">Username, Phone or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="Enter here"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter Password"/>
                </div>
                <button type="button" class="btn btn-primary" id="password-login-btn"
                    style="width:100%; margin-top:10px;" onclick="Auth.handlePasswordLogin()">
                    Sign In
                </button>
            </div>
            <!-- Switch to Register -->
            <div
                style="text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 14px;">
                Don't have an account?
                <a href="javascript:void(0)" onclick="Auth.openRegisterModal();"
                    style="color: var(--primary); font-weight: 700; text-decoration: none;">
                    Register here
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Customer Registration Modal -->
<div class="modal-backdrop" id="register-modal">
    <div class="modal-card" style="max-width: 500px;">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">Create Account</h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;">
                    Join DriveLuxe for instant bookings & exclusive perks
                </p>
            </div>
            <button class="modal-close" onclick="Auth.closeRegisterModal()">&times;</button>
        </div>

        <div class="modal-body">
            <form id="register-form" onsubmit="event.preventDefault(); Auth.handleRegister();">
                <!-- Name Row -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">First Name *</label>
                        <input type="text" id="reg-first-name" class="form-control" placeholder="Enter here" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name *</label>
                        <input type="text" id="reg-last-name" class="form-control" placeholder="Enter here" required />
                    </div>
                </div>

                <!-- Contact Info -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+91 ----------" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="user@example.com"
                            required />
                    </div>
                </div>

                <!-- Driver's License & Password -->
                <div class="form-group">
                    <label class="form-label">Driver's License Number *</label>
                    <input type="text" id="reg-license" class="form-control" placeholder="DL-NY-9847291" required />
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••"
                            minlength="8" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password *</label>
                        <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••"
                            minlength="8" required />
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="form-group" style="margin-top: 4px;">
                    <label
                        style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox" id="reg-terms" required
                            style="margin-top: 3px; accent-color: var(--primary);" />
                        <span>I agree to the <a href="#"
                                style="color: var(--primary); text-decoration: underline;">Terms of Service</a> & <a
                                href="#" style="color: var(--primary); text-decoration: underline;">Privacy
                                Policy</a>.</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="width: 100%; height: 46px; margin-top: 12px;">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Switch to Login -->
            <div style="text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 14px;">
                Already have an account? 
                <a href="javascript:void(0)" onclick="Auth.closeRegisterModal(); Auth.openAuthModal('otp');" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                    Sign In here
                </a>
            </div>
        </div>
    </div>
</div>
